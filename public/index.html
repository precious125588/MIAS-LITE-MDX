<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIAS MDX · Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #08090d;
      color: #f1f4f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }
    .background-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(37, 211, 102, 0.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 168, 132, 0.12), transparent 45%);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: rgba(18, 22, 30, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04);
      text-align: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid rgba(37, 211, 102, 0.3);
      color: #25d366;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 24px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #25d366;
      box-shadow: 0 0 12px #25d366;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .username-highlight {
      background: linear-gradient(135deg, #25d366 0%, #3ef2c4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      word-break: break-word;
    }
    p.subtext {
      color: #9ba3b4;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
      text-align: left;
    }
    .info-tile {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .info-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #717b8f;
      margin-bottom: 4px;
    }
    .info-val {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .footer-note {
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>
  <div class="card">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="badge-text">LIVE &amp; ACTIVE</span>
    </div>

    <h1>
      Bot is live for <br>
      <span id="bot-username" class="username-highlight">Connecting...</span>
    </h1>

    <p class="subtext" id="status-desc">
      Connected directly via Session ID. All WhatsApp services and auto-responders are running.
    </p>

    <div class="info-grid">
      <div class="info-tile">
        <div class="info-label">Mode</div>
        <div class="info-val" id="val-mode">SESSION ID</div>
      </div>
      <div class="info-tile">
        <div class="info-label">Status</div>
        <div class="info-val" style="color: #25d366;" id="val-status">Online</div>
      </div>
      <div class="info-tile">
        <div class="info-label">Uptime</div>
        <div class="info-val" id="val-uptime">Active</div>
      </div>
      <div class="info-tile">
        <div class="info-label">WhatsApp ID</div>
        <div class="info-val" id="val-jid">Connected</div>
      </div>
    </div>

    <div class="footer-note">
      MIAS-LITE-MDX &bull; Powered by JUST X
    </div>
  </div>

  <script>
    async function refreshStatus() {
      try {
        const res = await fetch('/api/bot-info');
        if (res.ok) {
          const data = await res.json();
          if (data && data.username) {
            document.getElementById('bot-username').textContent = data.username;
            if (data.jid) {
              document.getElementById('val-jid').textContent = data.jid.split('@')[0];
            }
            document.getElementById('val-status').textContent = 'Online';
            return;
          }
        }
      } catch (e) {}

      try {
        const readyRes = await fetch('/api/ready');
        if (readyRes.ok) {
          const r = await readyRes.json();
          if (r.uptime) {
            const mins = Math.floor(r.uptime / 60);
            const hrs = Math.floor(mins / 60);
            document.getElementById('val-uptime').textContent = hrs > 0 ? `${hrs}h ${mins % 60}m` : `${mins}m`;
          }
        }
      } catch (e) {}
    }

    refreshStatus();
    setInterval(refreshStatus, 8000);
  </script>
</body>
</html>
