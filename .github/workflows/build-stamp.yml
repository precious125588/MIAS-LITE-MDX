name: Refresh build stamp

# Every push to main re-hashes the guarded bot files and commits the new
# lib/precious-build-stamp.json, so the runtime stale-code guard always matches
# the code on main. The bot commit is tagged [skip ci] so this does not loop.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-stamp
  cancel-in-progress: false

jobs:
  stamp:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate stamp from the files on main
        run: node scripts/write-build-stamp.cjs
      - name: Verify the stamp matches the files
        run: node -e "require('./lib/precious-stale-guard.cjs').verify({name:'ci'})"
      - name: Commit the refreshed stamp
        run: |
          git config user.name "𝑷𝑹𝑬𝑪𝑰𝑶𝑼𝑺 x"
          git config user.email "build-stamp-bot@users.noreply.github.com"
          git add lib/precious-build-stamp.json
          if git diff --cached --quiet; then
            echo "Stamp already current"; exit 0
          fi
          git commit -m "chore: refresh build stamp [skip ci]"
          git push origin HEAD:main
